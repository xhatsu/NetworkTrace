apiVersion: v1
kind: ConfigMap
metadata:
  name: tracescope-obi
  namespace: tracescope
  labels:
    helm.sh/chart: tracescope-obi-0.2.0
    app.kubernetes.io/instance: tracescope-obi
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: tracescope
    app.kubernetes.io/name: tracescope-obi
data:
  obi.yml: |
    attributes:
      kubernetes:
        enable: true
    discovery:
      exclude_instrument:
      - k8s_namespace: kube-system
      instrument:
      - k8s_namespace: default
    ebpf:
      buffer_sizes:
        http: 2048
      payload_extraction:
        http:
          enrichment:
            enabled: true
            policy:
              default_action:
                body: exclude
                headers: exclude
            rules:
            - action: include
              match:
                patterns:
                - content-type
                - soapaction
                - x-forwarded-for
                - x-real-ip
                - x-wsse
                - authorization
                - user-agent
              scope: request
              type: headers
            - action: include
              match:
                methods:
                - POST
                - PUT
              scope: request
              type: body
            - action: include
              match:
                methods:
                - POST
                - PUT
              scope: response
              type: body
      track_request_headers: true
    log_level: info
    otel_traces_export:
      endpoint: http://tracescope-obi-collector.tracescope.svc.cluster.local:4317
      protocol: grpc

