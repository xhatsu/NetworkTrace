# Generated by render-stack.sh --mode clickhouse. Layer after values-secrets.yaml.
global:
  image:
    tag: "0.4.7"
storage:
  # Worker processes the ClickHouse traces written by the ingest pods.
  pipelineMode: clickhouse
  traceBackend: clickhouse
  # Must stay false: true makes /v1/traces accept and silently drop spans.
  clickhouseOnlyAgentTraces: false
elasticsearch:
  # APM/Elasticsearch is skipped entirely.
  enabled: false
  syncEnabled: false
behavior:
  enabled: true
ingress:
  enabled: false
app:
  service:
    type: NodePort
    port: 30102
    nodePort: 30102
ingest:
  enabled: true
  service:
    type: NodePort
    port: 30103
    nodePort: 30103
