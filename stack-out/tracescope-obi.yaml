apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tracescope-obi
  namespace: tracescope
  labels:
    helm.sh/chart: tracescope-obi-0.2.0
    app.kubernetes.io/instance: tracescope-obi
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: tracescope
    app.kubernetes.io/name: tracescope-obi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tracescope-obi
      app.kubernetes.io/instance: tracescope-obi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracescope-obi
        app.kubernetes.io/instance: tracescope-obi
        obi.variant: custom
      annotations:
        checksum/config: 3c154ba3b38441db293b5b2185b75da8e7cc69429259d6a448072aee8289a338
    spec:
      serviceAccountName: tracescope-obi
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      containers:
        - name: obi
          image: "xhatsu101/ebpf-instrument:xmlCustom-0.13.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: OTEL_EBPF_CONFIG_PATH
              value: /etc/obi/obi.yml
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_EBPF_KUBE_METADATA_ENABLE
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /etc/obi
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: tracescope-obi
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf

