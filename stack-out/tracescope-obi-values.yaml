# Generated by render-stack.sh --mode clickhouse.
obi:
  variant: custom
  discovery:
    instrument:
      - k8s_namespace: "default"
    excludeInstrument:
      - k8s_namespace: "kube-system"
  bodyCapture:
    enabled: true
collector:
  exporter:
    mode: tracescope
    tracescope:
      endpoint: "http://tracescope-ingest.tracescope.svc.cluster.local:30103"
  # TraceScope rejects >10000 spans / >10 MiB per request (non-retryable 413).
  batch:
    sendBatchSize: 2000
    sendBatchMaxSize: 5000
  redaction:
    # TraceScope does not persist bodies; drop them after WSSE extraction.
    dropBodies: true
