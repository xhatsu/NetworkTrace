{{- if .Values.obi.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "tracescope-obi.obiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracescope-obi.labels" . | nindent 4 }}
    app.kubernetes.io/name: tracescope-obi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tracescope-obi
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracescope-obi
        app.kubernetes.io/instance: {{ .Release.Name }}
        obi.variant: {{ .Values.obi.variant }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/obi-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "tracescope-obi.obiName" . }}
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.obi.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.obi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.obi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: obi
          image: {{ include "tracescope-obi.obiImage" . | quote }}
          imagePullPolicy: {{ .Values.obi.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: OTEL_EBPF_CONFIG_PATH
              value: /etc/obi/obi.yml
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_EBPF_KUBE_METADATA_ENABLE
              value: {{ .Values.obi.kubernetesMetadata | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/obi
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
          resources:
            {{- toYaml .Values.obi.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "tracescope-obi.obiName" . }}
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
{{- end }}
