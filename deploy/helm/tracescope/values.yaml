# Default values for tracescope Helm chart.
# Supports both:
# 1. Distributed topology (default: independent ingest, agent-stats, storage, ui, clickhouse)
# 2. Consolidated/Merged topology:
#    - Set ui.enabled: false to merge UI into the storage API pod.
#    - Set agentStats.enabled: false to merge agent telemetry into the ingest pod.
#    - Set clickhouse.enabled: false to use an external ClickHouse cluster.

global:
  imageRegistry: ""
  imagePullSecrets: []
  # Global image tag for TraceScope workloads (app, ingest, agentStats, ui).
  # Configure this once (e.g. "0.3.3") so all components share the unified version.
  # Can be overridden per workload below (app.image.tag, ingest.image.tag, etc.).
  image:
    tag: "0.3.3"

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# ClickHouse Database (Columnar Storage)
# -----------------------------------------------------------------------------
clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.8"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClass: ""
    size: 5Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 300m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  host: ""
  port: 8123
  database: tracescope
  user: default
  password: ""
  secure: false

# -----------------------------------------------------------------------------
# Storage Backend & Elasticsearch Integration
# Options for storage.backend: "clickhouse" (default) or "elasticsearch" / "elk"
# When "elasticsearch" is configured, trace queries (search, waterfall) query ELK
# directly via ElasticsearchTraceRepository while ClickHouse stores host/agent traces.
# -----------------------------------------------------------------------------
storage:
  backend: "clickhouse"
  clickhouseOnlyAgentTraces: true

elasticsearch:
  enabled: false
  url: "http://elasticsearch:9200"
  index: "traces-apm*,apm-*,traces-*"
  apiKey: ""
  user: ""
  password: ""
  verifyTls: true
  timeout: 10


# -----------------------------------------------------------------------------
# Application & Analytics Workload (StatefulSet: exactly 1 replica)
# Runs migrate (initContainer), api (main), and analytics-worker (sidecar).
# All 3 containers share the unified app image below.
# -----------------------------------------------------------------------------
app:
  replicaCount: 1
  image:
    repository: xhatsu101/tracescope
    # Defaults to global.image.tag when empty ("")
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: "1.5"
      memory: 1.5Gi
  worker:
    interval: 60
    # Optional start time cutoff: "now", "deploy_time", ISO-8601 string (e.g. "2026-09-16T00:00:00Z"), or epoch ms/seconds.
    startTime: ""
    # Set to true to automatically ignore all past trace data before worker deployment
    ignorePastData: false
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  migrations:
    enabled: true

# -----------------------------------------------------------------------------
# Ingestion Workload (Stateless Deployment)
# -----------------------------------------------------------------------------
ingest:
  # Set false when an external OpenTelemetry Collector owns ingestion.
  # This omits the ingest Deployment, Service, HPA, and public ingest routes.
  enabled: false
  replicaCount: 2
  image:
    repository: xhatsu101/tracescope
    # Defaults to global.image.tag when empty ("")
    tag: ""
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 75
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 2Gi
  service:
    type: NodePort
    port: 30103
    nodePort: 30103

# -----------------------------------------------------------------------------
# Agent Stats Workload (Stateless Deployment)
# Default: false (merged into Storage API for optimal cluster management).
# Set enabled: true if you want an isolated, independently scalable agent-stats pool.
# -----------------------------------------------------------------------------
agentStats:
  enabled: false
  replicaCount: 2
  image:
    repository: xhatsu101/tracescope
    # Defaults to global.image.tag when empty ("")
    tag: ""
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  service:
    type: ClusterIP
    port: 30104

# -----------------------------------------------------------------------------
# UI Workload (Stateless Nginx Deployment)
# Default: false (merged directly into the Storage API pod, saving 2 pods and
# eliminating extra Nginx config drift; the API pod natively serves / and /assets).
# Set enabled: true if you want a dedicated standalone Nginx edge for static assets.
# Note: enabling standalone UI requires a dedicated nginx 'ui' image target (do not use app image).
# -----------------------------------------------------------------------------
ui:
  enabled: false
  replicaCount: 2
  image:
    repository: xhatsu101/tracescope
    # Defaults to global.image.tag when empty ("")
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -----------------------------------------------------------------------------
# Secrets Configuration
# -----------------------------------------------------------------------------
# To deploy securely without committing tokens to git:
# 1. Copy the example file:
#      cp deploy/helm/tracescope/values-secrets.example.yaml deploy/helm/tracescope/values-secrets.yaml
# 2. Generate a 32+ char token for internalApiToken:
#      openssl rand -base64 32
# 3. Deploy with Helm:
#      helm upgrade --install tracescope deploy/helm/tracescope -f deploy/helm/tracescope/values-secrets.yaml
# -----------------------------------------------------------------------------
secrets:
  # Name of an externally created Secret (e.g. from HashiCorp Vault / ExternalSecrets operator)
  existingSecret: ""
  # Required internal storage token (min 32 chars). Generate with: openssl rand -base64 32
  internalApiToken: ""
  # Optional operator API key for dashboard/API protection. Leave "" for open access.
  apiKey: ""
  # Provider API Key for LLM investigation (e.g. OpenAI or gateway key). Required if llm.enabled=true.
  llmApiKey: ""

# -----------------------------------------------------------------------------
# LLM Diagnostic Investigation Configuration
# -----------------------------------------------------------------------------
llm:
  # Set true to enable LLM investigation of existing findings
  enabled: true
  # Safety acknowledgement: must be true to acknowledge single-owner execution
  singleOwnerAck: true
  # Base URL of OpenAI-compatible provider (e.g. https://api.openai.com/v1)
  baseUrl: "https://api.ai-box.vn/v1"
  # Model name to invoke (e.g. gpt-4o-mini, gemini-2.5-flash)
  model: "deepseek-v4.1-flash"
  # Response mode: json_object (default) or json_schema
  responseMode: "json_object"
  # Allow plain HTTP only for local loopback/testing (127.0.0.1)
  allowLoopbackHttp: true
  # Context token budget
  contextTokens: 256000

config:
  retentionDays: 30
  demoMode: false
  corsOrigins: "http://localhost:30102,http://tracescope.local,https://trace.n2d.id.vn"
  # Backend resource controls, aggregation budgets & anomaly engine knobs
  ingestMaxBatchBytes: 33554432
  aggregationMaxMemoryUsage: 1073741824
  aggregationExternalGroupByBytes: 268435456
  aggregationShadowEnabled: true
  aggregationCutover: false
  baselineCadenceSeconds: 300
  baselineSeriesBudget: 100
  anomalyWindowBudget: 100
  analyticsStageBudgetSeconds: 55
  highTpsWriter:
    queueCapacity: 256
    coalesceMs: 5
    transactionRecords: 50000
    commitTimeoutSeconds: 65
    internalRequestTimeoutSeconds: 70
  # Aggregation worker cutoff parameters
  workerStartTime: ""
  workerIgnorePastData: false

# -----------------------------------------------------------------------------
# Ingress Configuration
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  # server-snippet annotations are rejected by the cluster ingress admission
  # webhook (AllowSnippetAnnotations=false). /internal/* isolation is enforced
  # at the application middleware instead (404 to unauthenticated callers).
  serverSnippet:
    enabled: false
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "70"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "70"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  host: "trace.n2d.id.vn"
  # Support direct plain HTTP connections to the Ingress controller via IP / NodePort
  allowAnyHost: true
  tls: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1
