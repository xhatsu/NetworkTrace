{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tracescope.fullname" . }}
  labels:
    {{- include "tracescope.labels" . | nindent 4 }}
  annotations:
    {{- $snippetEnabled := true }}
    {{- if kindIs "map" .Values.ingress.serverSnippet }}
      {{- $snippetEnabled = .Values.ingress.serverSnippet.enabled }}
    {{- else if hasKey .Values.ingress "serverSnippet" }}
      {{- $snippetEnabled = eq (toString .Values.ingress.serverSnippet) "true" }}
    {{- end }}
    {{- if $snippetEnabled }}
    nginx.ingress.kubernetes.io/server-snippet: |
      location ^~ /internal/ { return 404; }
    {{- end }}
  {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- include "tracescope.ingressPaths" . | nindent 10 }}
    {{- end }}
    {{- if or (not .Values.ingress.host) .Values.ingress.allowAnyHost }}
    - http:
        paths:
          {{- include "tracescope.ingressPaths" . | nindent 10 }}
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
