apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tracescope.fullname" . }}-edge-config
  labels:
    {{- include "tracescope.labels" . | nindent 4 }}
data:
  OTEL_RUN_MIGRATIONS: "false"
  OTEL_DEMO_MODE: {{ .Values.config.demoMode | quote }}
  OTEL_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  OTEL_MAX_INGEST_BYTES: "10485760"
  OTEL_INGEST_MAX_BATCH_BYTES: {{ int .Values.config.ingestMaxBatchBytes | quote }}
  OTEL_INTERNAL_REQUEST_TIMEOUT_SECONDS: {{ .Values.config.highTpsWriter.internalRequestTimeoutSeconds | quote }}
  OTEL_STORAGE_OWNER_URL: {{ printf "http://%s-api:30102" (include "tracescope.fullname" .) | quote }}
