apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tracescope.fullname" . }}-config
  labels:
    {{- include "tracescope.labels" . | nindent 4 }}
data:
  OTEL_RETENTION_DAYS: {{ .Values.config.retentionDays | quote }}
  OTEL_CLICKHOUSE_HOST: {{ include "tracescope.clickhouseHost" . | quote }}
  OTEL_CLICKHOUSE_PORT: {{ .Values.clickhouse.port | quote }}
  OTEL_CLICKHOUSE_DATABASE: {{ .Values.clickhouse.database | quote }}
  OTEL_CLICKHOUSE_USER: {{ .Values.clickhouse.user | quote }}
  OTEL_CLICKHOUSE_SECURE: {{ .Values.clickhouse.secure | quote }}
  OTEL_TRACE_PIPELINE_MODE: {{ default "elk_to_clickhouse" .Values.storage.pipelineMode | quote }}
  OTEL_STORAGE_BACKEND: {{ default "clickhouse" .Values.storage.backend | quote }}
  OTEL_TRACE_STORAGE_BACKEND: "clickhouse"
  OTEL_CLICKHOUSE_ONLY_AGENT_TRACES: {{ .Values.storage.clickhouseOnlyAgentTraces | quote }}
  OTEL_ES_SYNC_ENABLED: {{ .Values.elasticsearch.syncEnabled | quote }}
  OTEL_ES_URL: {{ include "tracescope.elasticsearchUrl" . | quote }}
  OTEL_ES_INDEX: {{ default "traces-apm*,apm-*,traces-*" .Values.elasticsearch.index | quote }}
  OTEL_ES_VERIFY_TLS: {{ default true .Values.elasticsearch.verifyTls | quote }}
  OTEL_ES_TIMEOUT: {{ default 10 .Values.elasticsearch.timeout | quote }}
  OTEL_RUN_MIGRATIONS: "false"
  OTEL_DEMO_MODE: {{ .Values.config.demoMode | quote }}
  OTEL_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  OTEL_INGEST_QUEUE_CAPACITY: {{ .Values.config.highTpsWriter.queueCapacity | quote }}
  OTEL_INGEST_COALESCE_MS: {{ .Values.config.highTpsWriter.coalesceMs | quote }}
  OTEL_INGEST_TRANSACTION_RECORDS: {{ .Values.config.highTpsWriter.transactionRecords | quote }}
  OTEL_INGEST_COMMIT_TIMEOUT_SECONDS: {{ .Values.config.highTpsWriter.commitTimeoutSeconds | quote }}
  OTEL_INTERNAL_REQUEST_TIMEOUT_SECONDS: {{ .Values.config.highTpsWriter.internalRequestTimeoutSeconds | quote }}
  OTEL_INGEST_MAX_BATCH_BYTES: {{ int .Values.config.ingestMaxBatchBytes | quote }}
  OTEL_AGGREGATION_MAX_MEMORY_USAGE: {{ int .Values.config.aggregationMaxMemoryUsage | quote }}
  OTEL_AGGREGATION_EXTERNAL_GROUP_BY_BYTES: {{ int .Values.config.aggregationExternalGroupByBytes | quote }}
  OTEL_AGGREGATION_SHADOW_ENABLED: {{ .Values.config.aggregationShadowEnabled | quote }}
  OTEL_AGGREGATION_CUTOVER: {{ .Values.config.aggregationCutover | quote }}
  OTEL_BASELINE_CADENCE_SECONDS: {{ .Values.config.baselineCadenceSeconds | quote }}
  OTEL_BASELINE_SERIES_BUDGET: {{ .Values.config.baselineSeriesBudget | quote }}
  OTEL_ANOMALY_WINDOW_BUDGET: {{ .Values.config.anomalyWindowBudget | quote }}
  OTEL_WORKER_START_TIME: {{ default .Values.config.workerStartTime (dig "worker" "startTime" "" (default dict .Values.app)) | default "" | quote }}
  OTEL_WORKER_IGNORE_PAST_DATA: {{ default .Values.config.workerIgnorePastData (dig "worker" "ignorePastData" false (default dict .Values.app)) | default false | quote }}
  OTEL_LLM_INVESTIGATION_ENABLED: {{ default false (default dict .Values.llm).enabled | quote }}
  OTEL_LLM_SINGLE_OWNER_ACK: {{ default false (default dict .Values.llm).singleOwnerAck | quote }}
  OTEL_LLM_BASE_URL: {{ default "" (default dict .Values.llm).baseUrl | quote }}
  OTEL_LLM_MODEL: {{ default "" (default dict .Values.llm).model | quote }}
  OTEL_LLM_RESPONSE_MODE: {{ default "json_object" (default dict .Values.llm).responseMode | quote }}
  OTEL_LLM_ALLOW_LOOPBACK_HTTP: {{ default false (default dict .Values.llm).allowLoopbackHttp | quote }}
  OTEL_LLM_CONTEXT_TOKENS: {{ default 32768 (default dict .Values.llm).contextTokens | quote }}

  OTEL_SEMANTIC_ASSESSMENT_ENABLED: {{ default false (default dict .Values.semantic).enabled | quote }}
  OTEL_SEMANTIC_PROVIDER: {{ default "openrouter" (default dict .Values.semantic).provider | quote }}
  OTEL_SEMANTIC_BASE_URL: {{ default "https://openrouter.ai" (default dict .Values.semantic).baseUrl | quote }}
  OTEL_SEMANTIC_MODEL: {{ default "typesafe/jev-1.13" (default dict .Values.semantic).model | quote }}
  OTEL_SEMANTIC_TIMEOUT_SECONDS: {{ default 15 (default dict .Values.semantic).timeoutSeconds | quote }}
  OTEL_SEMANTIC_BATCH_SIZE: {{ default 2 (default dict .Values.semantic).batchSize | quote }}
  OTEL_SEMANTIC_BUDGET_SECONDS: {{ default 20 (default dict .Values.semantic).budgetSeconds | quote }}
  OTEL_SEMANTIC_RETRY_SECONDS: {{ default 900 (default dict .Values.semantic).retrySeconds | quote }}

  OTEL_BEHAVIOR_LEARNING_ENABLED: {{ default false (default dict .Values.behavior).enabled | quote }}
  OTEL_BEHAVIOR_BUDGET_SECONDS: {{ default 20 (default dict .Values.behavior).budgetSeconds | quote }}
