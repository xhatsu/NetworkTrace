{{- if not .Values.secrets.existingSecret }}
{{- $token := required "secrets.internalApiToken is required when secrets.existingSecret is empty" .Values.secrets.internalApiToken -}}
{{- if or (eq $token "change-me-in-production") (contains "change-in-production" $token) (lt (len $token) 32) -}}
{{- fail "secrets.internalApiToken must be a non-placeholder value of at least 32 characters" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracescope.fullname" . }}-secrets
  labels:
    {{- include "tracescope.labels" . | nindent 4 }}
type: Opaque
stringData:
  OTEL_INTERNAL_API_TOKEN: {{ $token | quote }}
  OTEL_API_KEY: {{ .Values.secrets.apiKey | quote }}
  OTEL_CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | quote }}
  OTEL_ES_API_KEY: {{ default "" .Values.elasticsearch.apiKey | quote }}
  OTEL_ES_USER: {{ default "" .Values.elasticsearch.user | quote }}
  OTEL_ES_PASSWORD: {{ default "" .Values.elasticsearch.password | quote }}
{{- end }}
