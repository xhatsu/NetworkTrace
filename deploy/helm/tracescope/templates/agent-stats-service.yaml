{{- if .Values.agentStats.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tracescope.fullname" . }}-agent-stats
  labels:
    {{- include "tracescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-stats
spec:
  type: ClusterIP
  selector:
    {{- include "tracescope.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent-stats
  ports:
    - name: http
      port: 30104
      targetPort: http
      protocol: TCP
{{- end }}
