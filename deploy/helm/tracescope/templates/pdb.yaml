{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tracescope.fullname" . }}-ingest
  labels:
    {{- include "tracescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "tracescope.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingest
---
{{- if .Values.agentStats.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tracescope.fullname" . }}-agent-stats
  labels:
    {{- include "tracescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-stats
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "tracescope.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent-stats
---
{{- end }}
{{- if .Values.ui.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tracescope.fullname" . }}-ui
  labels:
    {{- include "tracescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "tracescope.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
{{- end }}
{{- end }}
