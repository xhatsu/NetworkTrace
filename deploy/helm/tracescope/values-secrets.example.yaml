# =============================================================================
# TraceScope Helm Secrets Configuration Example (values-secrets.yaml)
# =============================================================================
# Copy this file to values-secrets.yaml (which is gitignored) and fill in values:
#   cp deploy/helm/tracescope/values-secrets.example.yaml deploy/helm/tracescope/values-secrets.yaml
#
# Deploy with Helm:
#   helm upgrade --install tracescope deploy/helm/tracescope -f deploy/helm/tracescope/values-secrets.yaml
# =============================================================================

secrets:
  # Internal token used for edge workload communication (Ingest/Agent -> Storage).
  # REQUIRED: Must be at least 32 random characters (not a placeholder).
  # Generate with: openssl rand -base64 32  or  openssl rand -hex 32
  internalApiToken: "REPLACE_WITH_OPENSSL_RAND_BASE64_32_MINIMUM_32_CHARS"

  # Optional operator API key for TraceScope HTTP APIs.
  # Leave empty ("") for open dashboard access (matching default deployment).
  # If set, clients must pass header 'X-API-Key: <apiKey>' or 'Authorization: Bearer <apiKey>'.
  apiKey: ""

  # LLM Diagnostic Investigation Provider API Key (e.g. OpenAI / deepseek / gateway key).
  # Required only when llm.enabled is true.
  llmApiKey: ""

# Optional ClickHouse password (if using an external secured ClickHouse cluster)
# clickhouse:
#   password: ""

# Optional Elasticsearch credentials (if storage.backend is "elasticsearch")
# elasticsearch:
#   apiKey: ""
#   user: ""
#   password: ""
