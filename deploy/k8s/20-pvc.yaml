# RWO deliberately belongs only to the single ClickHouse StatefulSet: block
# storage protects column-part consistency and avoids multi-writer filesystem semantics.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  namespace: tracescope
  labels:
    app.kubernetes.io/name: tracescope
    app.kubernetes.io/component: clickhouse
spec:
  # ClickHouse stores primary transaction logs and column parts here; no app pod mounts it.
  # ReadWriteOnce block storage supplies the consistency and I/O characteristics required.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
