# Only stateless ingest scales automatically; the ClickHouse RWO owner stays singleton.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tracescope-ingest
  namespace: tracescope
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tracescope-ingest
  minReplicas: 3
  maxReplicas: 12
  behavior:
    # Avoid flapping during bursty shipper retries, which would amplify backpressure.
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
