# ClusterIP gives Ingress a stable target while ingest pods scale behind it.
apiVersion: v1
kind: Service
metadata:
  name: tracescope-ingest
  namespace: tracescope
  labels:
    app.kubernetes.io/name: tracescope
    app.kubernetes.io/component: ingest
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tracescope
    app.kubernetes.io/component: ingest
  ports:
    - name: http
      port: 30103
      targetPort: http
      protocol: TCP
