# The app pod serves the UI and read APIs but does not mount ClickHouse data;
# state lives in the dedicated database StatefulSet, making this UI role replaceable.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tracescope-app
  namespace: tracescope
  labels:
    app.kubernetes.io/name: tracescope
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: tracescope
spec:
  serviceName: tracescope-app
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: tracescope
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracescope
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: tracescope
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Schema ownership is serialized before application traffic starts.
      initContainers:
        - name: migrate
          image: xhatsu101/tracescope:app-0.2.6
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "backend.cli", "migrate"]
          envFrom:
            - configMapRef:
                name: tracescope-config
            - secretRef:
                name: tracescope-secrets
          env:
            - name: OTEL_RUN_MIGRATIONS
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: xhatsu101/tracescope:app-0.2.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tracescope-config
            - secretRef:
                name: tracescope-secrets
          env:
            - name: OTEL_RUN_MIGRATIONS
              value: "false"
          # Separate startup/readiness/liveness avoids restarting a booting app while
          # still withholding traffic until its ClickHouse dependency is usable.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # Derivations stay beside the API deployment for an intentionally simple single-worker cadence.
        - name: analytics-worker
          image: xhatsu101/tracescope:app-0.2.6
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "backend.worker"]
          args: ["--interval", "60"]
          envFrom:
            - configMapRef:
                name: tracescope-config
            - secretRef:
                name: tracescope-secrets
          env:
            - name: OTEL_RUN_MIGRATIONS
              value: "false"
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
