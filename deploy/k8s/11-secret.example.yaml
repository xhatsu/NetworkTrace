# Example secret. DO NOT apply as-is: replace every placeholder value and
# prefer a sealed-secret / external secret manager in real clusters.
# The credentials are separate from the stateless UI image so browser delivery
# never needs access to ClickHouse or internal role-to-role authentication.
#
#   kubectl -n tracescope create secret generic tracescope-secrets \
#     --from-literal=OTEL_API_KEY="$(openssl rand -hex 24)" \
#     --from-literal=OTEL_INTERNAL_API_TOKEN="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: tracescope-secrets
  namespace: tracescope
  labels:
    app.kubernetes.io/name: tracescope
type: Opaque
stringData:
  # Empty OTEL_API_KEY disables X-API-Key enforcement (current behaviour).
  OTEL_API_KEY: ""
  # Required shared token for the internal storage-owner boundary.
  OTEL_INTERNAL_API_TOKEN: "replace-with-a-long-random-value"
  # ClickHouse password (if authentication is required)
  OTEL_CLICKHOUSE_PASSWORD: ""
