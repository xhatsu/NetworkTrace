apiVersion: v1
kind: ConfigMap
metadata:
  name: tracescope-config
  namespace: tracescope
  labels:
    app.kubernetes.io/name: tracescope
data:
  # --- storage -------------------------------------------------------------
  # ClickHouse owns durable data; the legacy path remains only a rollback/import
  # location and is never mounted by the scalable edge workloads.
  OTEL_RETENTION_DAYS: "30"
  # --- ClickHouse configuration --------------------------------------------
  OTEL_CLICKHOUSE_HOST: "tracescope-clickhouse"
  OTEL_CLICKHOUSE_PORT: "8123"
  OTEL_CLICKHOUSE_DATABASE: "tracescope"
  OTEL_CLICKHOUSE_USER: "default"
  OTEL_CLICKHOUSE_SECURE: "false"
  # --- storage backend & elasticsearch integration -------------------------
  # Set to "elasticsearch" to query ELK directly for application trace data.
  OTEL_STORAGE_BACKEND: "clickhouse"
  OTEL_CLICKHOUSE_ONLY_AGENT_TRACES: "true"
  OTEL_ES_URL: ""
  OTEL_ES_INDEX: "traces-apm*,apm-*,traces-*"
  OTEL_ES_VERIFY_TLS: "true"
  OTEL_ES_TIMEOUT: "10"
  # --- schema ownership ----------------------------------------------------
  # The app init container overrides this to true. Runtime containers leave it
  # false so independently rolled pods cannot race ClickHouse schema changes.
  OTEL_RUN_MIGRATIONS: "false"
  # --- behaviour -----------------------------------------------------------
  OTEL_DEMO_MODE: "false"
  OTEL_CORS_ORIGINS: "http://localhost:30102,http://tracescope.local"
  # --- high-TPS ingest writer ---------------------------------------------
  # These bounds trade a few milliseconds of latency for efficient block inserts
  # and define when callers receive HTTP 429 plus a retry hint instead of OOM risk.
  OTEL_INGEST_QUEUE_CAPACITY: "256"
  OTEL_INGEST_COALESCE_MS: "5"
  OTEL_INGEST_TRANSACTION_RECORDS: "50000"
  OTEL_INGEST_COMMIT_TIMEOUT_SECONDS: "65"
  OTEL_INTERNAL_REQUEST_TIMEOUT_SECONDS: "70"
  # --- aggregation worker cutoff -------------------------------------------
  # Timestamp (ISO-8601, epoch ms/seconds, or "now") to skip historical traces
  OTEL_WORKER_START_TIME: ""
  # When true, ignores all historical data prior to deployment time
  OTEL_WORKER_IGNORE_PAST_DATA: "false"
  # --- LLM diagnostic investigation ----------------------------------------
  # Set to "true" to enable LLM investigation of existing findings
  OTEL_LLM_INVESTIGATION_ENABLED: "false"
  # Safety acknowledgement: must be "true" to acknowledge single-owner execution
  OTEL_LLM_SINGLE_OWNER_ACK: "false"
  # Base URL of OpenAI-compatible provider (e.g. https://api.openai.com/v1)
  OTEL_LLM_BASE_URL: ""
  # Model name to invoke (e.g. gpt-4o-mini, gemini-2.5-flash)
  OTEL_LLM_MODEL: ""
  # Response mode: json_object (default) or json_schema
  OTEL_LLM_RESPONSE_MODE: "json_object"
  # Allow plain HTTP only for local loopback/testing (127.0.0.1)
  OTEL_LLM_ALLOW_LOOPBACK_HTTP: "false"
  # Context token budget
  OTEL_LLM_CONTEXT_TOKENS: "32768"
